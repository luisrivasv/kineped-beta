<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PediKine">
  <title>PediKine</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="shell" class="shell">
    <header class="topbar">
      <button id="backBtn" class="round-btn" aria-label="Volver" hidden>‹</button>
      <div class="brand">
        <div class="brand-title-wrap"><div class="brand-title" id="pageTitle">PediKine</div><span class="version-badge">v0.9</span></div>
        <div class="brand-subtitle" id="pageSubtitle">Herramientas respiratorias pediátricas</div>
      </div>
      <button id="infoBtn" class="round-btn" aria-label="Información">?</button>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav">
      <button data-nav="home" class="nav-button active"><span>⌂</span><small>Inicio</small></button>
      <button data-nav="scores" class="nav-button"><span>♢</span><small>Scores</small></button>
      <button data-nav="cnahf" class="nav-button"><span>≈</span><small>CNAF</small></button>
      <button data-nav="references" class="nav-button"><span>▤</span><small>Fuentes</small></button>
    </nav>
  </div>

  <dialog id="modal">
    <section class="modal-card">
      <header class="modal-header">
        <h2 id="modalTitle">Información</h2>
        <button id="modalClose" class="round-btn">×</button>
      </header>
      <div id="modalBody"></div>
    </section>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
